# paylane datastores.
#
# In state S1 the application services run as host processes (see
# scripts/start-s1.sh) and only the datastores run in containers.
#
#   docker compose up -d      start postgres + redis
#   docker compose down       stop them (data survives in the volume)
#   docker compose down -v    stop them and delete the data
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: paylane
      POSTGRES_PASSWORD: paylane_dev_pw
      POSTGRES_DB: paylane
    ports:
      - "5432:5432"
    volumes:
      - paylane-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylane -d paylane"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  paylane-pgdata:
